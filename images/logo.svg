<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Balance Scale Base -->
  <rect x="380" y="400" width="40" height="100" fill="#2c3e50"/>
  <rect x="350" y="480" width="100" height="20" fill="#2c3e50"/>
  
  <!-- Balance Beam -->
  <rect x="200" y="250" width="400" height="20" fill="#34495e" transform="rotate(-0 400 260)"/>
  
  <!-- Left Pan - Growth Strategy Document -->
  <rect x="150" y="300" width="120" height="150" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="160" y="330" font-family="Arial" font-size="16" fill="#2c3e50">GROWTH</text>
  <text x="160" y="350" font-family="Arial" font-size="16" fill="#2c3e50">STRATEGY</text>
  <line x1="160" y1="370" x2="260" y2="370" stroke="#95a5a6" stroke-width="2"/>
  <line x1="160" y1="390" x2="260" y2="390" stroke="#95a5a6" stroke-width="2"/>
  <circle cx="180" cy="420" r="15" fill="#3498db"/>
  
  <!-- Right Pan - Growth Graph -->
  <rect x="530" y="300" width="120" height="150" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
  <polyline points="550,420 580,390 610,370 640,330" fill="none" stroke="#27ae60" stroke-width="3"/>
  <rect x="550" y="400" width="20" height="30" fill="#3498db"/>
  <rect x="580" y="380" width="20" height="50" fill="#3498db"/>
  <rect x="610" y="360" width="20" height="70" fill="#3498db"/>
  
  <!-- Center Pivot -->
  <circle cx="400" cy="260" r="15" fill="#7f8c8d"/>
  
  <!-- Arrow -->
  <polygon points="400,200 380,230 420,230" fill="#2c3e50"/>
</svg>
